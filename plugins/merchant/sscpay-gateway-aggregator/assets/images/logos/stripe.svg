<svg xmlns="http://w3.org" viewBox="0 0 100 100" width="100" height="100">
  <!-- 1. 外层正方形卡片背景 -->
  <rect width="92" height="92" x="4" y="4" fill="#1E293B" rx="16"/>

  <!-- 2. 仿真金属微芯片 (Chip) -->
  <rect width="18" height="14" x="16" y="24" fill="#F59E0B" rx="3"/>
  <path stroke="#1E293B" stroke-width="1" d="M25 24v14M16 31h18M20 24s2 3 0 7M30 24s-2 3 0 7M20 38s2-3 0-7M30 38s-2-3 0-7"/>

  <!-- 3. 抽象的信用卡卡号（用圆点和线条替代，避免发卡行暗示） -->
  <g fill="#94A3B8">
    <!-- 第一组卡号 -->
    <circle cx="20" cy="52" r="2.5"/>
    <circle cx="28" cy="52" r="2.5"/>
    <circle cx="36" cy="52" r="2.5"/>
    <circle cx="44" cy="52" r="2.5"/>

    <!-- 后续卡号用极简线条代替，视觉更干净 -->
    <rect width="16" height="4" x="52" y="50" rx="2"/>
    <rect width="16" height="4" x="72" y="50" rx="2"/>
  </g>

  <!-- 4. 右下角通用持卡人/过期日点缀 -->
  <rect width="24" height="3" x="16" y="68" fill="#64748B" rx="1.5"/>
  <rect width="12" height="3" x="16" y="75" fill="#64748B" rx="1.5"/>
</svg>