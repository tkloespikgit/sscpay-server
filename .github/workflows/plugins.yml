name: Plugin protocol checks

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      PLUGIN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      OPENCART_TEST_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306'
      OPENCART_TEST_MYSQL_USER: root
      OPENCART_TEST_MYSQL_PASSWORD: sscpay-ci-only
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: sscpay-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -psscpay-ci-only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, zip, pdo_sqlite, pdo_mysql, gd, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install gateway plugin dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress --working-dir=plugins/merchant/sscpay-gateway-aggregator
        env:
          COMPOSER_ROOT_VERSION: dev-main
      - name: Check protocol and plugin versions
        shell: bash
        run: |
          if [[ -n "$PLUGIN_BASE" && ! "$PLUGIN_BASE" =~ ^0+$ ]]; then
            php artisan plugins:check --base="$PLUGIN_BASE" --no-interaction
          else
            php artisan plugins:check --no-interaction
          fi
      - name: Test plugin behavior and distribution
        run: php artisan test --compact tests/Unit/WordPressPaymentProtocolTest.php tests/Feature/PluginDistributionTest.php tests/Feature/WordPressV2ContractTest.php tests/Feature/SyncPluginReleasesTest.php tests/Feature/DeploymentScriptTest.php tests/Unit/OpenCartPaymentProtocolTest.php tests/Feature/OpenCartGatewayTest.php tests/Feature/OpenCartV2ContractTest.php tests/Feature/OpenCartDistributionTest.php tests/Feature/OpenCartStorageTest.php
      - name: Test server v2 contract
        run: php artisan test --compact tests/Feature/CombinedPaymentTest.php tests/Feature/OrderCustomerIpTest.php tests/Feature/OrderNotificationRetryTest.php
      - name: Test itemized gateway refunds and callback retries
        run: |
          php artisan test --compact tests/Feature/GatewayRefundReceiptTest.php tests/Feature/GatewayRefundChargebackTest.php tests/Feature/OrderAccountingRecoveryTest.php
          php plugins/merchant/sscpay-gateway-aggregator/tests/refund-drivers.php
          php plugins/merchant/sscpay-gateway-aggregator/tests/refund-delivery.php
          php plugins/merchant/sscpay-gateway-aggregator/tests/callback-queue-recovery.php
      - name: Test concurrent duplicate refunds on MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_USERNAME: root
          DB_PASSWORD: sscpay-ci-only
          SSCPAY_ALLOW_MYSQL_CONCURRENCY: '1'
        run: |
          export DB_DATABASE="sscpay_test_$(openssl rand -hex 8)"
          export SSCPAY_CONCURRENCY_DATABASE="$DB_DATABASE"
          MYSQL_PWD="$DB_PASSWORD" mysql -h "$DB_HOST" -u "$DB_USERNAME" -e "CREATE DATABASE $DB_DATABASE"
          php vendor/bin/phpunit tests/Feature/MySqlSettlementConcurrencyTest.php --filter=test_concurrent_refund_redeliveries
      - name: Test receiving-site product API
        run: php plugins/merchant/sscpay-gateway-aggregator/tests/product-catalog.php
      - name: Test receiving-site settings, logs and updates
        run: |
          php plugins/merchant/sscpay-gateway-aggregator/tests/admin-settings.php
          php plugins/merchant/sscpay-gateway-aggregator/tests/legacy-upgrade.php
          php plugins/merchant/sscpay-gateway-aggregator/tests/log-pagination.php
          php plugins/merchant/sscpay-gateway-aggregator/tests/update-checker.php
      - name: Test gateway plugin downloads from the payment method pages
        run: php artisan test --compact tests/Feature/Filament/GatewayPluginDownloadTest.php

  php-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check plugin PHP compatibility
        run: find plugins/wordpress plugins/opencart plugins/merchant -type d -name vendor -prune -o -type f -name '*.php' -print0 | xargs -0 -n1 php -l
